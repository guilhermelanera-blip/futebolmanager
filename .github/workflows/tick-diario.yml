name: Relógio da liga — tick diário

# Dispara todo dia às 00:05 America/Sao_Paulo (03:05 UTC — o fuso é fixo,
# sem horário de verão no Brasil desde 2019). Manutenção + mercado +
# inatividade + finanças diárias (08_RELOGIO_E_SIMULACAO, seção 1).
on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch: {} # botão "Run workflow" no GitHub, pra testar na mão

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /v1/scheduler/tick
        run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/v1/scheduler/tick" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
